[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grsync-qt"
version = "0.1.0"
description = "Browse and download photos from a Ricoh GR III / GR IIIx over Wi-Fi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
grsync-qt = "grsync_qt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A worker thread crashing must fail the run, not hide in a warning.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
